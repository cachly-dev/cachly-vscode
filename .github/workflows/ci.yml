name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      # Die Tests brauchen Quellen aus dem Monorepo (sdk/mcp, Hook-Buendel). Im
      # Spiegel liegen die nicht daneben. Sie laufen im Monorepo in
      # .github/workflows/ci.yml (bereich sdk_vscode). Der Spiegel baut nur.

      - name: Compile
        run: npm run compile

      - name: Package (dry run)
        run: npm run package
